# Format: RequestClass=ResponseClass:requestField=responseField,...
# Поле можно указать путём: patient.uuid, person.names[0].givenName
# Даты сюда не включены: в запросе и ответе у них разный формат, их проверяет тест.

CreatePatientRequest=PatientResponse:person.gender=person.gender,person.names[0].givenName=person.preferredName.givenName,person.names[0].familyName=person.preferredName.familyName,identifiers[0].identifier=identifiers[0].identifier
AppointmentRequest=AppointmentResponse:patientUuid=patient.uuid,serviceUuid=service.uuid,appointmentKind=appointmentKind,comments=comments
