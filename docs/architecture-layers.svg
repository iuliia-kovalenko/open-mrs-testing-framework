<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="706" style="color:#44575e" viewBox="0 0 1020 706" role="img" aria-label="Слои фреймворка: тесты вызывают Steps, Steps передают запрос Requester-ам, Requester-ы собраны из Endpoint, спецификаций и моделей и отправляют HTTP-запрос в OpenMRS. Вспомогательные пакеты: db, models.comparison, generators, storage, configs. E2E-02 читает базу MariaDB напрямую через db.">
  <title>Слои фреймворка</title>
  <style>
    .band { fill: #ecf2f3; stroke: #d3dee1; }
    .chip { fill: #ffffff; stroke: #98adb3; }
    .side { fill: #ffffff; stroke: #98adb3; stroke-dasharray: 5 4; }
    .ext { fill: #dff1ef; stroke: #0a7570; stroke-width: 1.5; }
    .hl { fill: #ffffff; stroke: #0a7570; stroke-width: 1.8; }
    .ghost { fill: none; stroke: #0a7570; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .lane { fill: #ecf2f3; stroke: none; }
    .wrap1 { fill: #ecf2f3; stroke: #98adb3; }
    .wrap2 { fill: #dff1ef; stroke: #0a7570; stroke-width: 1.5; }
    .wrap3 { fill: #ffffff; stroke: #98adb3; }
    .arr { fill: none; stroke: #44575e; stroke-width: 1.5; }
    .arr-d { fill: none; stroke: #44575e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .lead-line { fill: none; stroke: #98adb3; stroke-width: 1; }
    .dot { fill: #44575e; }
    .t-layer { font: 600 13.5px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #16242a; }
    .t-pkg { font: 400 11px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #586a71; }
    .t-note { font: 400 11.5px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #586a71; }
    .t-cls { font: 500 11.5px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #16242a; }
    .t-cls-s { font: 500 10.5px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #16242a; }
    .t-desc { font: 400 11px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #586a71; }
    .t-arrow { font: 400 11px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #44575e; }
    .t-code { font: 400 12px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #16242a; }
    .t-strong { font: 600 12.5px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #16242a; }
    .t-accent { font: 600 12px "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0a7570; }
  </style>
  <rect x="0" y="0" width="1020" height="706" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Band 1: tests -->
  <rect class="band" x="20" y="20" width="680" height="118" rx="10"/>
  <text class="t-layer" x="36" y="42">Тесты <tspan class="t-pkg" dx="6">src/test/java/api</tspan></text>
  <text class="t-note" x="684" y="42" text-anchor="end">сценарий и проверки</text>
  <rect class="chip" x="36" y="52" width="100" height="46" rx="7"/>
  <text class="t-cls" x="86" y="71" text-anchor="middle">auth</text>
  <text class="t-desc" x="86" y="88" text-anchor="middle">AUTH-02</text>
  <rect class="chip" x="142" y="52" width="150" height="46" rx="7"/>
  <text class="t-cls" x="217" y="71" text-anchor="middle">patient</text>
  <text class="t-desc" x="217" y="88" text-anchor="middle">PAT-02, 03 · SRCH-02</text>
  <rect class="chip" x="298" y="52" width="120" height="46" rx="7"/>
  <text class="t-cls" x="358" y="71" text-anchor="middle">appointment</text>
  <text class="t-desc" x="358" y="88" text-anchor="middle">APT-02, 03</text>
  <rect class="chip" x="424" y="52" width="160" height="46" rx="7"/>
  <text class="t-cls" x="504" y="71" text-anchor="middle">visit</text>
  <text class="t-desc" x="504" y="88" text-anchor="middle">VIS-02, 03, 05, 06</text>
  <rect class="chip" x="590" y="52" width="94" height="46" rx="7"/>
  <text class="t-cls" x="637" y="71" text-anchor="middle">e2e</text>
  <text class="t-desc" x="637" y="88" text-anchor="middle">E2E-02</text>
  <text class="t-note" x="36" y="122">Все тестовые классы наследуют <tspan class="t-cls-s">BaseTest</tspan>: softly, assertAll() и очистка данных после теста</text>

  <!-- Band 2: steps -->
  <rect class="band" x="20" y="172" width="680" height="84" rx="10"/>
  <text class="t-layer" x="36" y="194">Steps <tspan class="t-pkg" dx="6">requests/steps</tspan></text>
  <text class="t-note" x="684" y="194" text-anchor="end">данные, предусловия, чтение</text>
  <rect class="chip" x="36" y="206" width="120" height="36" rx="7"/>
  <text class="t-cls-s" x="96" y="228" text-anchor="middle">PatientSteps</text>
  <rect class="chip" x="168" y="206" width="120" height="36" rx="7"/>
  <text class="t-cls-s" x="228" y="228" text-anchor="middle">AppointmentSteps</text>
  <rect class="chip" x="300" y="206" width="120" height="36" rx="7"/>
  <text class="t-cls-s" x="360" y="228" text-anchor="middle">VisitSteps</text>
  <rect class="chip" x="432" y="206" width="120" height="36" rx="7"/>
  <text class="t-cls-s" x="492" y="228" text-anchor="middle">EncounterSteps</text>
  <rect class="chip" x="564" y="206" width="120" height="36" rx="7"/>
  <text class="t-cls-s" x="624" y="228" text-anchor="middle">ReferenceSteps</text>

