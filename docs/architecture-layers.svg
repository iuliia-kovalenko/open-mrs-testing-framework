  <text class="t-note" x="684" y="312" text-anchor="end">один тип запроса — один класс</text>
  <text class="t-desc" x="36" y="346">→ модель ответа</text>
  <rect class="chip" x="150" y="326" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="214" y="346" text-anchor="middle">ValidatedCrud</text>
  <rect class="chip" x="284" y="326" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="348" y="346" text-anchor="middle">ValidatedSearch</text>
  <rect class="chip" x="418" y="326" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="482" y="346" text-anchor="middle">ValidatedAction</text>
  <line class="arr" x1="214" y1="358" x2="214" y2="376" marker-end="url(#ah1)"/>
  <line class="arr" x1="348" y1="358" x2="348" y2="376" marker-end="url(#ah1)"/>
  <line class="arr" x1="482" y1="358" x2="482" y2="376" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="222" y="371">содержит</text>
  <text class="t-desc" x="36" y="398">→ сырой ответ</text>
  <rect class="chip" x="150" y="378" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="214" y="398" text-anchor="middle">Crud</text>
  <rect class="chip" x="284" y="378" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="348" y="398" text-anchor="middle">Search</text>
  <rect class="chip" x="418" y="378" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="482" y="398" text-anchor="middle">Action</text>
  <rect class="chip" x="552" y="378" width="128" height="32" rx="7"/>
  <text class="t-cls-s" x="616" y="398" text-anchor="middle">Session</text>

  <!-- Band 4: foundation -->
  <rect class="band" x="20" y="458" width="680" height="138" rx="10"/>
  <text class="t-layer" x="36" y="480">Основа <tspan class="t-pkg" dx="6">requests/skeleton · specs · models</tspan></text>
  <text class="t-note" x="684" y="480" text-anchor="end">из чего собран запрос</text>
  <rect class="chip" x="36" y="490" width="208" height="44" rx="7"/>
  <text class="t-cls" x="48" y="508">Endpoint</text>
  <text class="t-desc" x="48" y="525">путь + модель запроса и ответа</text>
  <rect class="chip" x="256" y="490" width="208" height="44" rx="7"/>
  <text class="t-cls" x="268" y="508">HttpRequest</text>
  <text class="t-desc" x="268" y="525">общий конструктор Requester-ов</text>
  <rect class="chip" x="476" y="490" width="208" height="44" rx="7"/>
  <text class="t-cls" x="488" y="508">interfaces</text>
  <text class="t-desc" x="488" y="525">Crud, Search, Action, Session</text>
  <rect class="chip" x="36" y="542" width="208" height="44" rx="7"/>
  <text class="t-cls" x="48" y="560">RequestSpecs</text>
  <text class="t-desc" x="48" y="577">Basic-авторизация, шаги Allure</text>
  <rect class="chip" x="256" y="542" width="208" height="44" rx="7"/>
  <text class="t-cls" x="268" y="560">ResponseSpecs</text>
  <text class="t-desc" x="268" y="577">ожидаемый статус: 200, 201, 204</text>
  <rect class="chip" x="476" y="542" width="208" height="44" rx="7"/>
  <text class="t-cls" x="488" y="560">models</text>
  <text class="t-desc" x="488" y="577">BaseModel, *Request, *Response</text>

  <!-- External: OpenMRS -->
  <rect class="ext" x="20" y="630" width="680" height="60" rx="10"/>
  <text class="t-layer" x="360" y="655" text-anchor="middle">OpenMRS REST API</text>
  <text class="t-pkg" x="360" y="674" text-anchor="middle">gateway :80 · /openmrs/ws/rest/v1</text>

  <!-- Main flow arrows -->
  <line class="arr" x1="360" y1="138" x2="360" y2="169" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="370" y="159">вызывают</text>
  <line class="arr" x1="360" y1="256" x2="360" y2="287" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="370" y="277">передают запрос</text>
  <line class="arr" x1="360" y1="424" x2="360" y2="455" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="370" y="445">собраны из</text>
  <line class="arr" x1="360" y1="596" x2="360" y2="627" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="370" y="617">HTTP-запрос</text>

  <!-- Side column -->
  <rect class="side" x="760" y="20" width="220" height="52" rx="8"/>
  <text class="t-cls" x="870" y="41" text-anchor="middle">db</text>
  <text class="t-desc" x="870" y="59" text-anchor="middle">DbClient · DbQueries</text>
  <line class="arr" x1="700" y1="46" x2="757" y2="46" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="730" y="40" text-anchor="middle">SQL</text>

  <rect class="side" x="760" y="86" width="220" height="52" rx="8"/>
  <text class="t-cls" x="870" y="107" text-anchor="middle">models.comparison</text>
  <text class="t-desc" x="870" y="125" text-anchor="middle">ModelAssertions + правила</text>
  <line class="arr" x1="700" y1="112" x2="757" y2="112" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="730" y="106" text-anchor="middle">сверка</text>

  <rect class="side" x="760" y="172" width="220" height="84" rx="8"/>
  <text class="t-cls" x="870" y="194" text-anchor="middle">generators</text>
  <text class="t-cls-s" x="870" y="214" text-anchor="middle">RandomModelGenerator</text>
  <text class="t-desc" x="870" y="232" text-anchor="middle">RandomData · TestDates</text>
  <line class="arr" x1="760" y1="222" x2="703" y2="222" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="731" y="216" text-anchor="middle">данные</text>

  <rect class="side" x="760" y="320" width="220" height="52" rx="8"/>
  <text class="t-cls" x="870" y="341" text-anchor="middle">storage</text>
  <text class="t-cls-s" x="870" y="359" text-anchor="middle">CreatedPatientStorage</text>
  <line class="arr" x1="700" y1="342" x2="757" y2="342" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="730" y="336" text-anchor="middle">uuid</text>

  <rect class="side" x="760" y="490" width="220" height="96" rx="8"/>
  <text class="t-cls" x="870" y="514" text-anchor="middle">configs</text>
  <text class="t-cls-s" x="870" y="534" text-anchor="middle">Config</text>
  <text class="t-desc" x="870" y="554" text-anchor="middle">config.properties</text>
  <text class="t-desc" x="870" y="572" text-anchor="middle">-Dключ=… важнее файла</text>
  <line class="arr" x1="760" y1="564" x2="703" y2="564" marker-end="url(#ah1)"/>
  <text class="t-arrow" x="731" y="558" text-anchor="middle">адрес</text>

  <rect class="ext" x="760" y="630" width="220" height="60" rx="10"/>
  <text class="t-layer" x="870" y="655" text-anchor="middle">MariaDB</text>
  <text class="t-pkg" x="870" y="674" text-anchor="middle">порт 3307 на компьютере</text>
