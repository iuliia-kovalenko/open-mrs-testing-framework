  <text class="t-arrow" x="730" y="654" text-anchor="middle">пишет</text>

  <!-- db reads MariaDB directly -->
  <path class="arr" d="M980 46 H996 V660 H983" marker-end="url(#ah1)"/>
  <text class="t-arrow" transform="translate(1010 353) rotate(-90)" text-anchor="middle">JDBC</text>
</svg>
